services:
  backend:
    build: ./backend
    environment:
      APP_ENV: prod
      APP_SECRET: change-me-in-production
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/properties/facets"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    build: ./frontend
    environment:
      # Server-side address of the Symfony API (used by the Nuxt server proxy).
      NUXT_API_BASE_URL: http://backend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
